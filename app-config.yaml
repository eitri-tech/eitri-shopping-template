eitri-apps:
    - path: ./shopping-vtex-template-shared
      workspace: shared
      alias: shared
      focus: false
      shared: true
    - path: ./shopping-vtex-template-home
      workspace: home
      alias: home
      focus: true
      shared: false
    - path: ./shopping-vtex-template-pdp
      workspace: pdp
      alias: pdp
      focus: false
      shared: false
    - path: ./shopping-vtex-template-account
      workspace: account
      alias: account
      focus: false
      shared: false
    - path: ./shopping-vtex-template-cart
      workspace: cart
      alias: cart
      focus: false
      shared: false
    - path: ./shopping-vtex-template-checkout
      workspace: checkout
      alias: checkout
      focus: false
      shared: false
bottom-tab-view-simulation:
  eitri-apps:
    - slug: "shopping-vtex-template-home"
      title: "Inicio"
      initialization-params:
        type: "string"
        value: "tabIndex=0"
    - slug: "shopping-vtex-template-home"
      title: "Categorias"
      initialization-params:
        type: "string"
        value: "tabIndex=1&route=Categories"
    - slug: "shopping-vtex-template-cart"
      title: "Carrinho"
      initialization-params:
        type: "string"
        value: "tabIndex=2"
    - slug: "shopping-vtex-template-home"
      title: "Ofertas"
      initialization-params:
        type: "string"
        value: "tabIndex=3&route=LandingPage"
    - slug: "shopping-vtex-template-account"
      title: "Perfil"
      initialization-params:
        type: "string"
        value: "tabIndex=4"
  layout:
    layout:
      theme: "classic"
      backgroundColor: "#FFFFFF"
      selectedColor: "#373737"
      unselectedColor: "#8B8D98"
      badgeBackground: "#E5484D"
      badgeTextColor: "#FFFFFF"
      themeCustomizations:
        classic:
          labels: "shown"
          topBorder:
            thickness: 1
            color: "#DBDDE0"
    eitriApps:
      - title: "Inicio"
        icon: "https://media-eitri-content.eitri.tech/default/icon_home_v1.png"
      - title: "Categorias"
        icon: "https://media-eitri-content.eitri.tech/default/icon_menu_v1.png"
      - title: "Carrinho"
        icon: "https://media-eitri-content.eitri.tech/default/icon_cart_v1.png"
      - title: "Ofertas"
        icon: "https://media-eitri-content.eitri.tech/default/icon_favorite_v1.png"
      - title: "Perfil"
        icon: "https://media-eitri-content.eitri.tech/default/icon_user_v1.png"

application-id: 9022c0fb-885f-4a5f-b99f-7e065189b893